name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'werf.yaml'
      - '.helm/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'

jobs:
  test:
    runs-on: netpulse-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  converge:
    needs: test
    runs-on: netpulse-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # werf derives image tags from git content, so it needs real history,
          # not the single-commit shallow clone actions/checkout makes by default
          fetch-depth: 0

      - name: Install werf
        uses: werf/actions/install@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p $HOME/.kube
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials runner \
            --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context default \
            --cluster=in-cluster --user=runner --namespace=netpulse
          kubectl config use-context default

      # Kept outside the chart on purpose: the value comes from GitHub secrets,
      # and putting it in a template would write it into the release state.
      - name: Ensure application secret
        run: |
          kubectl create secret generic netpulse-secrets \
            --namespace=netpulse \
            --from-literal=IPGEOLOCATION_API_KEY="${{ secrets.IPGEOLOCATION_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Converge
        run: |
          . $(werf ci-env github --as-file)
          werf converge \
            --repo docker.io/xdearboy/netpulse \
            --release netpulse \
            --namespace netpulse \
            --synchronization kubernetes://netpulse
        env:
          WERF_ENV: production
